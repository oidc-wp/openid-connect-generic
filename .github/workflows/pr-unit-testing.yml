name: PR Unit Testing

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Triggers the workflow on pull request events
  pull_request:
    branches:
      - develop

env:
  ACTION_VERSION: 3

jobs:
  pr_unit_testing:
    runs-on: ubuntu-latest

    name: 'Unit Test PR in Latest Stable Requirements'

    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout Code
      # https://github.com/marketplace/actions/checkout
      uses: actions/checkout@v7

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761 # master, 2025-05-08
      with:
        swap-size-gb: 10

    - name: Start Docker Environment
      run: docker compose up -d

    - name: Run PHPUnit Tests
      run: docker compose exec app /bin/bash -c 'composer install && composer phpunit'

    - name: Shutdown Docker Environment
      if: success() || failure()
      run: docker compose down

    - name: Generate Coverage Report
      if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      # https://github.com/marketplace/actions/coverage-report-as-comment-clover
      uses: lucassabreu/comment-coverage-clover@92c9c9f0d9640bce558851c62295d99b13deacb3 # v0.17.5
      with:
        file: clover.xml


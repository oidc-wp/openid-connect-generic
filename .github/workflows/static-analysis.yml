name: Static Code Analysis

on:
  pull_request:
  push:
    branches:
      - 'develop'
      - 'release/**'
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

env:
  PHP_VERSION: '8.2'
  WP_MULTISITE: 0
  COMPOSER_VERSION: '2.6'
  ACTION_VERSION: 3

jobs:
  check_static_analysis:
    name: Setup & Perform Static Analysis

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      # https://github.com/marketplace/actions/checkout
      uses: actions/checkout@v7

    - name: Get Composer Cache Directory
      id: composer-cache
      if: ${{ !env.ACT }}
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer dependencies
      if: ${{ !env.ACT }}
      # https://github.com/marketplace/actions/cache
      uses: actions/cache@v6
      env:
        composer-cache-name: cache-composer
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-build-${{ env.composer-cache-name }}-v${{ env.ACTION_VERSION }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.composer-cache-name }}-v${{ env.ACTION_VERSION }}-

    - name: Setup PHP & Composer Environment
      # https://github.com/marketplace/actions/setup-php-action
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ env.PHP_VERSION }}
        tools: "composer:${{ env.COMPOSER_VERSION }}"

    - name: Environment Check
      run: php -v && composer --version

    - name: Install Composer Dependencies
      run: composer install

    - name: Perform Static Analysis
      run: composer run-script analyze
